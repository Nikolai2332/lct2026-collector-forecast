# Демо-режим (локальный показ): docker compose up --build
# Production на VPS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (см. docs/DEPLOY_VPS.md). Значения по умолчанию ниже — только для демо: с ними production не стартует.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collector}
      POSTGRES_USER: ${POSTGRES_USER:-collector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-collector}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-collector}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-env-min-32-bytes}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_SCALE: ${SEED_SCALE:-demo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Пул соединений с PostgreSQL под 40 одновременных пользователей (docs/LOADTEST.md)
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-30}
      # Симуляция потока (проигрывание рассчитанных прогнозов) и расписание (APScheduler в процессе API)
      SIM_ENABLED: ${SIM_ENABLED:-true}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(sAMAccountName={username})}
      LDAP_ROLE_GROUPS: ${LDAP_ROLE_GROUPS:-}
      LDAP_SCOPE_GROUPS: ${LDAP_SCOPE_GROUPS:-}
      LDAP_START_TLS: ${LDAP_START_TLS:-false}
      LDAP_CA_FILE: ${LDAP_CA_FILE:-}
      LDAP_GROUP_FILTER: ${LDAP_GROUP_FILTER:-(|(member={user_dn})(uniqueMember={user_dn}))}
      LDAP_GROUP_BASE_DN: ${LDAP_GROUP_BASE_DN:-}
    ports:
      # Swagger для демо — только с этой машины. На VPS порт не публикуется совсем (docker-compose.prod.yml)
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # false — реальный API через прокси /api; true — демо на моках MSW
      USE_MOCKS: ${FRONTEND_USE_MOCKS:-false}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
