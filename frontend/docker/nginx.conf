# Файл подключается в контекст http (conf.d), поэтому map, log_format и limit_req_zone — здесь.

# В логах — путь без query-строки: в адресах бывают тикеты SSE и поисковые запросы
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

# Лимиты — с адреса клиента. У заказчика вся смена может выходить через один корпоративный NAT/прокси, поэтому они
# рассчитаны на 40 пользователей за одним адресом (нагрузочный тест, docs/LOADTEST.md): при 10 входах в минуту
# начало смены у 20+ диспетчеров упиралось в 429.
# Вход: 60 попыток в минуту с адреса (+20 всплеском) — против флуда. Перебор паролей останавливает API:
# 5 неудачных входов на логин и 30 на адрес за 5 минут (app/api/auth.py)
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
# Остальной API — только против явного флуда: открытие дашборда — около 6 запросов разом на пользователя
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_status 429;

# Схема исходного запроса: от Caddy (https) или своя (http в demo)
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log noquery;

    # Реальный IP клиента от реверс-прокси (Caddy в production) из частных сетей docker.
    # Caddy не доверяет входящему X-Forwarded-For и ставит адрес клиента сам
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Тело запроса: по умолчанию 1 МБ; больше — только импорт и поток событий (ниже)
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # DNS Docker: имя api резолвится при запросе, nginx стартует даже если api ещё поднимается
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Общие настройки прокси к API. X-Forwarded-For перезаписываем адресом клиента (после real_ip),
    # чтобы подставной заголовок из запроса не попал в audit_log
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;

    # SSE: без буферизации и с длинным таймаутом, иначе события приходят пачками
    location = /api/notifications/stream {
        proxy_pass $api_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Accel-Buffering no;
    }

    location ~ ^/api/auth/(login|token)$ {
        limit_req zone=login burst=20 nodelay;
        proxy_pass $api_upstream;
    }

    # Импорт CSV/XLSX — до 50 МБ, поток событий — до 10 МБ (10 000 событий)
    location = /api/import {
        client_max_body_size 50m;
        client_body_timeout 120s;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_pass $api_upstream;
    }
    location = /api/ingest/events {
        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_pass $api_upstream;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass $api_upstream;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Рантайм-конфиг и service worker MSW не кэшируем
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }
    location = /mockServiceWorker.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Файлы с хэшем в имени — навсегда
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: всё остальное — index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
