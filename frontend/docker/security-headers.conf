# Заголовки безопасности. Подключается в server и в каждый location со своим add_header:
# nginx не наследует add_header внутрь location, где есть собственный add_header.
# CSP: скрипты только свои (/config.js и сборка Vite без inline-скриптов); стили inline нужны
# Ant Design (CSS-in-JS); ECharts рисует в canvas; worker — service worker MSW в режиме моков.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS добавляет Caddy в production (deploy/Caddyfile): по http в demo он не нужен и вреден
