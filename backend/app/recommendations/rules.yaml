# Правила рекомендаций по техническому обслуживанию.
#
# ПРОЕКТ ПРАВИЛ — ТРЕБУЕТ СОГЛАСОВАНИЯ СО СПЕЦИАЛИСТАМИ ЭКСПЛУАТАЦИИ.
# Правила составлены по данным журналов (виды отказов, повторы, соседи по объекту, точность модели по типам
# датчиков), ответам заказчика в чате хакатона (23.09.2026: «Неисправен» — факт потери связи с устройством, причину
# выясняет выезд; приоритет типов — газовые, пожарные, охранные; датчики метана по графику ППР АКМ демонтируются
# на ≈ 10–15 дней) и здравому смыслу обслуживания. Пункты регламентов (в том числе РТЭК) здесь не цитируются:
# их текста у команды нет. Сроки — рабочие предложения, их нужно сверить с регламентными сроками заказчика.
#
# Как читать:
#   params      — настраиваемые пороги (их можно менять без правки кода; API перечитывает файл при изменении).
#   sensor_groups — группы типов датчиков: тип попадает в группу, если его название содержит одно из слов
#                 (без учёта регистра). Работает и для демо-справочника, и для справочника заказчика.
#   rules       — проверяются сверху вниз, срабатывает ПЕРВОЕ правило, у которого выполнены все условия `when`.
#   modifiers   — дополнительные предупреждения «чего не делать»; добавляются к любому сработавшему правилу.
#
# Условия `when` (все должны выполняться):
#   kind: [...]                 — предполагаемый вид отказа: link (потеря связи), fault (неисправность датчика),
#                                 disconnected («Отключено устройство»), value (сбой значения — служебный код или
#                                 «01.01.1970» вместо показания), group (групповое отключение объекта — плановые работы),
#                                 power (питание), drift (недостоверные показания), unknown (не ясно).
#                                 link / fault / disconnected / value приходят из kind_probs модели v3, если они есть
#   group / not_group: [...]    — группа типа датчика (sensor_groups)
#   min_risk / max_risk         — уровень риска прогноза: normal < attention < risk < critical
#   mass_link: true / false     — массовая потеря связи: у params.mass_link_neighbors и более ДРУГИХ датчиков
#                                 того же объекта тоже пропадает связь, и это не меньше params.mass_link_share объекта
#   faults_30d_min / faults_90d_min: N      — отказов канала за 30 / 90 дней (все виды)
#   same_kind_90d_min: N        — отказов того же вида, что и предполагаемый, за 90 дней
#   faults_since_repair_min: N  — отказов после закрытия последней выполненной заявки (не старше repair_days)
#   low_precision_type: true    — точность модели (Precision) для этого типа датчика ниже params.low_precision
#   flapping: true              — дребезг статуса (смен статуса за сутки ≥ params.flap_changes и ≥ 3× нормы)
#   stuck_share_min: доля       — доля одинаковых показаний подряд (залипание), 0..1
#
# Поля правила:
#   id          — код; он же код строки в справочнике рекомендаций (recommendations.code = "rule:<id>")
#   title       — короткое название для таблиц
#   action      — что сделать (текст справочника и поле «Что сделать» в заявке)
#   facts       — какие факты показать в обосновании (их текст строит движок по данным)
#   conclusion  — вывод простыми словами, завершает обоснование
#   priority    — from_risk (по уровню риска), raise (на ступень выше), или low / medium / high / critical
#   priority_min — не ниже этого приоритета
#   due_hours   — рекомендуемый срок в часах; не задан — по приоритету (params.due_hours)
#   assignee    — кому (служба или бригада, общими словами)
#   avoid       — чего не делать (необязательно)
#   plan: true  — работа попадает во вкладку «Рекомендованные работы» (профилактика на ближайшие дни)
#   per_object: true — при создании черновиков из «Рекомендованных работ» одна заявка на объект, а не на каждый датчик
#   work_order: false — заявка не нужна (норма, наблюдение)

version: "2026-09-26"
source: "Проект правил, требует согласования со специалистами эксплуатации"

params:
  # Массовая потеря связи: у стольких соседей по объекту тоже пропадает связь И это не меньше такой доли объекта.
  # Доля нужна потому, что в реальных объектах по 100–700 датчиков и 3–5 % из них молчат в любой срез
  # (29.06.2026 23:00: 250 из 7 654 каналов, медиана по объектам ≈ 5 %)
  mass_link_neighbors: 3
  mass_link_share: 0.08
  # «Обесточен» у фазы считается новым, если за столько дней до последних суток его не было
  # (у части фаз оно бывает ежедневно — похоже на штатное состояние резервных фаз)
  power_quiet_days: 7
  # Precision модели по типу датчика ниже этого — сначала удалённая проверка, потом выезд
  low_precision: 0.5
  # Дребезг: смен статуса за сутки не меньше этого и не меньше трёх «норм» типа датчика
  flap_changes: 10
  # Сколько дней после выполненной заявки считать ремонт «недавним»
  repair_days: 14
  # Сроки по приоритету, часы
  due_hours: {critical: 4, high: 24, medium: 72, low: 168}
  # Приоритет работ не ниже этого для групп датчиков (заказчик: приоритет типов — газовые, пожарные, охранные).
  # Применяется ко всем правилам, где нужна заявка
  min_priority_by_group: {gas: high, smoke: medium, fire: medium}
  # Групповое отключение: среди причин прогноза молчит не меньше такой доли однотипных датчиков объекта
  # (правило разметки v3: ≥ 80 % однотипных каналов объекта молчат одновременно — плановые работы, не отказ датчика)
  group_silence_share: 0.5

sensor_groups:
  smoke: ["дым"]
  fire: ["теплов", "ручной", "извещател", "уир"]
  gas: ["газ", "метан", "угарн", "кислород", "сероводород"]
  temperature: ["температур"]
  pump: ["насос"]
  fan: ["вентилятор"]
  power: ["фаз", "ввод питания"]
  ups: ["ибп"]
  flood: ["затоплен", "уровня воды"]
  security: ["движени", "дверь", "дверн", "люк", "стекло", "вскрыти", "кд ", "охран"]

rules:
  - id: group_planned_works
    title: "Групповое отключение — вероятно, плановые работы"
    when: {kind: [group]}
    action: "Уточнить у службы эксплуатации, не идут ли на объекте плановые работы (ППР, демонтаж датчиков метана по графику ППР АКМ) или отключение объекта. Если работ нет — одна заявка на объект: проверка шкафа автоматики и линии связи."
    facts: [group_silence, silence, neighbors]
    conclusion: "молчит большая часть однотипных датчиков объекта одновременно — это плановые работы или отключение объекта, а не отказ отдельного датчика"
    priority: medium
    due_hours: 24
    assignee: "Диспетчер смены, служба эксплуатации"
    avoid: "Не выезжать по каждому датчику объекта отдельно"
    work_order: false
    per_object: true

  - id: power_object
    title: "Питание объекта"
    when: {kind: [power], min_risk: attention}
    action: "Проверить электропитание объекта: вводной автомат и АВР, автоматы и контакторы щита, напряжение по фазам. Датчики объекта проверять после восстановления питания."
    facts: [power, silence, neighbors, fault_msgs]
    conclusion: "вероятна проблема питания объекта, а не отдельного датчика"
    priority: from_risk
    priority_min: high
    assignee: "Электромонтёры участка"
    avoid: "Не менять датчики, пока не восстановлено питание объекта"
    plan: true
    per_object: true

  - id: mass_link_loss
    title: "Массовая потеря связи в объекте"
    when: {kind: [link], mass_link: true, min_risk: attention}
    action: "Проверить шкаф автоматики объекта: контроллер и его питание, коммутационное оборудование и линию связи объекта."
    facts: [silence, neighbors]
    conclusion: "вероятна проблема линии связи или шкафа объекта, а не датчика"
    priority: from_risk
    priority_min: high
    assignee: "Служба связи и автоматики (КИПиА)"
    avoid: "Не создавать заявки на каждый датчик объекта отдельно — достаточно одной заявки на объект"
    plan: true
    per_object: true

  - id: repeat_after_repair
    title: "Повтор после ремонта — замена"
    when: {min_risk: attention, faults_since_repair_min: 1}
    action: "Внеплановая замена датчика (или его модуля) вместо повторной проверки."
    facts: [repair, repeats, current]
    conclusion: "после недавнего ремонта отказ повторяется — очередная проверка вряд ли поможет"
    priority: raise
    assignee: "Бригада КИПиА"
    avoid: "Не ограничиваться повторным осмотром — он уже проводился"
    plan: true

  - id: value_failure
    title: "Сбой значения — проверка передачи"
    when: {kind: [value]}
    action: "Проверить передачу значения: настройки и прошивку контроллера (преобразователя), линию до датчика. Значение «01.01.1970» или код производителя (-127, -3276, 327,68) вместо показания — сбой передачи или измерительного канала; датчик менять после проверки."
    facts: [value_fail, repeats, current]
    conclusion: "вместо показаний приходят служебные значения — по ответу заказчика это неисправность"
    priority: from_risk
    priority_min: medium
    assignee: "Служба связи и автоматики (КИПиА)"
    avoid: "Не считать такие значения реальными показаниями (температура -127 — не мороз, газ 327,68 % — не утечка)"
    plan: true

  - id: chronic_fault
    title: "Повторные «Неисправен» — диагностика и замена"
    when: {kind: [fault, disconnected], same_kind_90d_min: 3}
    action: "Выезд с диагностикой: связь с устройством (питание, шлейф, адресный модуль) и сам датчик; если причина в датчике — замена, а не очередной сброс."
    facts: [fault_msgs, flap, repeats]
    conclusion: "связь с устройством теряется снова и снова — вероятна деградация датчика или его линии"
    priority: raise
    assignee: "Бригада КИПиА"
    plan: true

  - id: chronic_link
    title: "Повторные потери связи — линия датчика"
    when: {kind: [link], same_kind_90d_min: 3, mass_link: false}
    action: "Проверить линию связи датчика по всей трассе: разъёмы, кабель, адресный модуль; при повторе — заменить модуль или участок кабеля."
    facts: [silence, repeats, neighbors]
    conclusion: "связь пропадает у этого датчика снова и снова, у соседей — нет: вероятна проблема в его линии"
    priority: from_risk
    priority_min: medium
    assignee: "Служба связи и автоматики (КИПиА)"
    plan: true

  - id: verify_remote_first
    title: "Сначала удалённая проверка"
    when: {kind: [link, unknown], low_precision_type: true, min_risk: attention}
    action: "Сначала удалённая проверка: камеры, соседние датчики, журнал событий объекта. Выезд — если отсутствие связи подтвердится."
    facts: [silence, precision, neighbors]
    conclusion: "для этого типа датчиков модель часто даёт ложные тревоги"
    priority: medium
    due_hours: 4
    assignee: "Диспетчер смены, затем бригада КИПиА"
    avoid: "Не направлять бригаду без удалённой проверки"

  - id: fault_diagnostics
    title: "«Неисправен» — выезд с диагностикой"
    when: {kind: [fault, disconnected]}
    action: "Выезд с диагностикой: питание и шлейф датчика, адресный модуль, контакты и крепление; при повторе — замена датчика."
    facts: [fault_msgs, flap, repeats]
    conclusion: "система мониторинга сообщает «Неисправен» — связь с устройством потеряна, причину выясняет выезд"
    priority: from_risk
    assignee: "Бригада КИПиА"

  - id: gas_calibration
    title: "Газоанализатор — калибровка"
    when: {group: [gas], kind: [drift]}
    action: "Проверить калибровку газоанализатора поверочной смесью; при дрейфе — заменить сенсор."
    facts: [stuck, values, repeats]
    conclusion: "показания газоанализатора недостоверны: они «застыли» или расходятся с соседями"
    priority: from_risk
    priority_min: medium
    assignee: "Бригада КИПиА (газовый контроль)"
    plan: true

  - id: temperature_check
    title: "Датчик температуры — сверка и поверка"
    when: {group: [temperature], kind: [drift]}
    action: "Сверить показания с переносным термометром; при расхождении — поверка или замена датчика."
    facts: [stuck, values, repeats]
    conclusion: "показания датчика температуры вызывают сомнения"
    priority: from_risk
    assignee: "Бригада КИПиА"
    plan: true

  - id: drift_check
    title: "Недостоверные показания — сверка"
    when: {kind: [drift]}
    action: "Сверить показания с переносным прибором или соседними датчиками; при расхождении — калибровка или замена."
    facts: [stuck, values]
    conclusion: "показания датчика вызывают сомнения"
    priority: from_risk
    assignee: "Бригада КИПиА"

  - id: pump_unit
    title: "Насос — проверка агрегата"
    when: {group: [pump], min_risk: attention}
    action: "Проверить насосный агрегат: питание и пускатель, поплавковые датчики уровня, отсутствие засора всаса; датчик состояния — после агрегата."
    facts: [current, fault_msgs, repeats]
    conclusion: "датчик состояния отражает работу насоса — неисправен может быть сам агрегат"
    priority: from_risk
    assignee: "Бригада водоотведения"
    plan: true

  - id: fan_unit
    title: "Вентилятор — проверка агрегата"
    when: {group: [fan], min_risk: attention}
    action: "Проверить вентилятор: пускатель, привод и подшипники, ток двигателя; датчик состояния — после агрегата."
    facts: [current, fault_msgs, repeats]
    conclusion: "датчик состояния отражает работу вентилятора — неисправен может быть сам агрегат"
    priority: from_risk
    assignee: "Бригада вентиляции"
    plan: true

  - id: ups_check
    title: "ИБП — проверка"
    when: {group: [ups], min_risk: attention}
    action: "Проверить ИБП: наличие сети на входе, состояние батарей, журнал событий ИБП."
    facts: [current, silence, fault_msgs, repeats]
    conclusion: "от ИБП зависит питание оборудования объекта"
    priority: from_risk
    priority_min: medium
    assignee: "Электромонтёры участка"
    plan: true

  - id: single_link
    title: "Потеря связи одного датчика"
    when: {kind: [link], min_risk: attention}
    action: "Проверить питание и линию связи датчика: разъём, кабель, адресный модуль или контроллер шлейфа."
    facts: [silence, neighbors, repeats]
    conclusion: "массовой потери связи в объекте нет — проблема, вероятно, в самом датчике или его линии"
    priority: from_risk
    assignee: "Служба связи и автоматики (КИПиА)"

  - id: watch
    title: "Наблюдение"
    when: {min_risk: attention}
    action: "Наблюдать: оценить датчик повторно на следующем срезе прогноза; выезд пока не нужен."
    facts: [current, repeats]
    conclusion: "явных признаков конкретной неисправности нет"
    priority: low
    due_hours: 24
    assignee: "Диспетчер смены"
    work_order: false

  - id: routine
    title: "Плановое ТО"
    when: {}
    action: "Внеочередных работ не требуется — обслуживание по графику."
    facts: [current]
    conclusion: "риск отказа низкий"
    priority: low
    assignee: "—"
    work_order: false

modifiers:
  - id: open_order
    # По датчику уже есть открытая заявка
    avoid: "Не создавать повторную заявку: по датчику уже открыта {open_order}"
  - id: gas_planned_works
    # Массовая тишина газовых датчиков объекта: так выглядит плановый демонтаж по графику ППР АКМ
    avoid: "Прежде чем выезжать, сверить с графиком ППР АКМ: при плановом демонтаже датчики метана объекта молчат ≈ 10–15 дней"
  - id: recent_visit
    # Заявка по датчику выполнена меньше суток назад, новых отказов после неё не было
    avoid: "Не выезжать повторно: заявка {recent_visit} выполнена меньше суток назад, отказов после неё не было"
